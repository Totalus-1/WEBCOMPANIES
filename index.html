<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Web Companies</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #333;
      color: white;
      padding: 10px 0;
      text-align: center;
    }
    h1 {
      margin: 0;
    }
    .content {
      padding: 20px;
    }
    .card {
      background-color: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <header>
    <h1>Web Companies</h1>
  </header>
  
  <div class="content">
    <div class="card">
      <h2>Alüminyum Firması</h2>
      <p>Firma: ABC Alüminyum</p>
      <p>Sektör: Metal İşleme</p>
    </div>
    <div class="card">
      <h2>CNC Makine Firması</h2>
      <p>Firma: XYZ CNC</p>
      <p>Sektör: CNC Üretimi</p>
    </div>
  </div>
</body>
</html>
